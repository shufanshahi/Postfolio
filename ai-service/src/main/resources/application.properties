#spring.redis.timeout=2000ms
#spring.redis.jedis.pool.max-active=8
#spring.redis.jedis.pool.max-idle=8
#spring.redis.jedis.pool.min-idle=0

# RabbitMQ Configuration
spring.rabbitmq.host=localhost
spring.rabbitmq.port=5672
spring.rabbitmq.username=guest
spring.rabbitmq.password=guest

# Gemini API Configuration
gemini.api.key=AIzaSyDyu3V1zVQxZYZb-MMnP0UJMIT2WXRI-KY
gemini.api.url=https://generativelanguage.googleapis.com/v1beta/models/gemini-2.0-flash:generateContent

# Async Processing Configuration
spring.task.execution.pool.core-size=5
spring.task.execution.pool.max-size=20
spring.task.execution.pool.queue-capacity=100

# Circuit Breaker Configuration
resilience4j.circuitbreaker.instances.gemini-api.sliding-window-size=10
resilience4j.circuitbreaker.instances.gemini-api.minimum-number-of-calls=5
resilience4j.circuitbreaker.instances.gemini-api.failure-rate-threshold=50
resilience4j.circuitbreaker.instances.gemini-api.wait-duration-in-open-state=30000

# Actuator endpoints
management.endpoints.web.exposure.include=health,info,metrics,prometheus
management.endpoint.health.show-details=always

# Logging
logging.level.com.example.aiservice=DEBUG
logging.level.org.springframework.amqp=INFO

# JWT Configuration - Must match the secret key used in main server
jwt.secret=postfolio-super-secret-key-1234567890!@#$
