# Redis Configuration
spring.data.redis.host=localhost
spring.data.redis.port=6379
spring.data.redis.password=
spring.data.redis.database=0
spring.data.redis.timeout=2000ms

# Redis Connection Pool
spring.data.redis.lettuce.pool.max-active=8
spring.data.redis.lettuce.pool.max-idle=8
spring.data.redis.lettuce.pool.min-idle=0
spring.data.redis.lettuce.pool.max-wait=-1ms

# Cache Configuration
spring.cache.type=redis
spring.cache.redis.time-to-live=86400000
spring.cache.redis.cache-null-values=false

# Circuit Breaker Configuration
resilience4j.circuitbreaker.instances.gemini-api.sliding-window-size=10
resilience4j.circuitbreaker.instances.gemini-api.failure-rate-threshold=50
resilience4j.circuitbreaker.instances.gemini-api.wait-duration-in-open-state=30s
resilience4j.circuitbreaker.instances.gemini-api.permitted-number-of-calls-in-half-open-state=3

# Timeout Configuration
resilience4j.timelimiter.instances.gemini-api.timeout-duration=30s
resilience4j.timelimiter.instances.gemini-api.cancel-running-future=true

# Thread Pool Configuration for Async Processing
spring.task.execution.pool.core-size=8
spring.task.execution.pool.max-size=16
spring.task.execution.pool.queue-capacity=100
spring.task.execution.pool.keep-alive=60s

# RabbitMQ Configuration for AI Service Communication
spring.rabbitmq.host=localhost
spring.rabbitmq.port=5672
spring.rabbitmq.username=guest
spring.rabbitmq.password=guest

# AI Service Configuration (using service discovery)
ai-service.base-url=http://ai-service
ai-service.timeout=30000

# Circuit Breaker Configuration for AI Service
resilience4j.circuitbreaker.instances.ai-service.sliding-window-size=10
resilience4j.circuitbreaker.instances.ai-service.minimum-number-of-calls=5
resilience4j.circuitbreaker.instances.ai-service.failure-rate-threshold=50
resilience4j.circuitbreaker.instances.ai-service.wait-duration-in-open-state=30000
