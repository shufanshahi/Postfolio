version: '3.8'

services:
  # PostgreSQL Database
  postgres:
    image: postgres:15-alpine
    container_name: postfolio-postgres
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-postfolio}
      POSTGRES_USER: ${POSTGRES_USER403 :-postgres}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-admin}
    ports:
      - "5433:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    networks:
      - postfolio-network
    healthcheck:
      test: [ "CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-postgres}" ]
      interval: 30s
      timeout: 10s
      retries: 3

  # Redis Cache
  redis:
    image: redis:7-alpine
    container_name: postfolio-redis
    ports:
      - "6379:6379"
    volumes:
      - redis_data:/data
    networks:
      - postfolio-network
    healthcheck:
      test: [ "CMD", "redis-cli", "ping" ]
      interval: 30s
      timeout: 10s
      retries: 3

  # RabbitMQ Message Queue
  rabbitmq:
    image: rabbitmq:3-management-alpine
    container_name: postfolio-rabbitmq
    environment:
      RABBITMQ_DEFAULT_USER: ${RABBITMQ_USER:-guest}
      RABBITMQ_DEFAULT_PASS: ${RABBITMQ_PASSWORD:-guest}
    ports:
      - "5672:5672"
      - "15672:15672" # Management UI
    volumes:
      - rabbitmq_data:/var/lib/rabbitmq
    networks:
      - postfolio-network
    healthcheck:
      test: [ "CMD", "rabbitmqctl", "status" ]
      interval: 30s
      timeout: 10s
      retries: 3

  # Eureka Service Discovery
  eureka-server:
    build:
      context: ./eureka-server
      dockerfile: Dockerfile
    container_name: postfolio-eureka
    environment:
      EUREKA_INSTANCE_HOSTNAME: eureka-server
      SPRING_PROFILES_ACTIVE: docker
    ports:
      - "8761:8761"
    networks:
      - postfolio-network
    # healthcheck:
    #   test: [ "CMD", "curl", "-f", "http://localhost:8761/actuator/health" ]
    #   interval: 30s
    #   timeout: 10s
    #   retries: 5
    #   start_period: 40s

    # Main Backend Service
  postfolio-backend:
    build:
      context: ./server
      dockerfile: Dockerfile
    container_name: postfolio-backend
    environment:
      SPRING_PROFILES_ACTIVE: docker
      SPRING_DATASOURCE_URL: jdbc:postgresql://postgres:5432/${POSTGRES_DB:-postfolio}
      SPRING_DATASOURCE_USERNAME: ${POSTGRES_USER:-postgres}
      SPRING_DATASOURCE_PASSWORD: ${POSTGRES_PASSWORD:-admin}
      SPRING_DATA_REDIS_HOST: redis
      SPRING_DATA_REDIS_PORT: 6379
      EUREKA_CLIENT_SERVICE_URL_DEFAULTZONE: http://eureka-server:8761/eureka
      GEMINI_API_KEY: ${GEMINI_API_KEY}
      NEWS_API_KEY: ${NEWS_API_KEY}
      STRIPE_SECRET_KEY: ${STRIPE_SECRET_KEY}
    ports:
      - "8082:8082"
      - "9092:9092" # Socket.IO port
    volumes:
      - interview_audio:/app/static/interview-audio
    networks:
      - postfolio-network
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
      eureka-server:
        condition: service_started
    # healthcheck:
    #   test: [ "CMD", "curl", "-f", "http://localhost:8082/actuator/health" ]
    #   interval: 30s
    #   timeout: 10s
    #   retries: 5
    #   start_period: 60s

    # AI Service
  ai-service:
    build:
      context: ./ai-service
      dockerfile: Dockerfile
    container_name: postfolio-ai-service
    environment:
      SPRING_PROFILES_ACTIVE: docker
      SPRING_DATASOURCE_URL: jdbc:postgresql://postgres:5432/${POSTGRES_DB:-postfolio}
      SPRING_DATASOURCE_USERNAME: ${POSTGRES_USER:-postgres}
      SPRING_DATASOURCE_PASSWORD: ${POSTGRES_PASSWORD:-admin}
      SPRING_RABBITMQ_HOST: rabbitmq
      SPRING_RABBITMQ_PORT: 5672
      SPRING_RABBITMQ_USERNAME: ${RABBITMQ_USER:-guest}
      SPRING_RABBITMQ_PASSWORD: ${RABBITMQ_PASSWORD:-guest}
      EUREKA_CLIENT_SERVICE_URL_DEFAULTZONE: http://eureka-server:8761/eureka
      GEMINI_API_KEY: ${GEMINI_API_KEY}
    ports:
      - "8081:8081"
    networks:
      - postfolio-network
    depends_on:
      postgres:
        condition: service_healthy
      rabbitmq:
        condition: service_healthy
      eureka-server:
        condition: service_started
    # healthcheck:
    #   test: [ "CMD", "curl", "-f", "http://localhost:8081/actuator/health" ]
    #   interval: 30s
    #   timeout: 10s
    #   retries: 5
    #   start_period: 60s

    # API Gateway
  api-gateway:
    build:
      context: ./api-gateway
      dockerfile: Dockerfile
    container_name: postfolio-gateway
    environment:
      SPRING_PROFILES_ACTIVE: docker
      EUREKA_CLIENT_SERVICE_URL_DEFAULTZONE: http://eureka-server:8761/eureka
    ports:
      - "8080:8080"
    networks:
      - postfolio-network
    depends_on:
      eureka-server:
        condition: service_started
      postfolio-backend:
        condition: service_started
      ai-service:
        condition: service_started
      stripe-service:
        condition: service_started
    # healthcheck:
    #   test: [ "CMD", "curl", "-f", "http://localhost:8080/actuator/health" ]
    #   interval: 30s
    #   timeout: 10s
    #   retries: 5
    #   start_period: 60s

    # Stripe Payment Service
  stripe-service:
    build:
      context: ./stripe
      dockerfile: Dockerfile
    container_name: postfolio-stripe
    environment:
      SPRING_PROFILES_ACTIVE: docker
      EUREKA_CLIENT_SERVICE_URL_DEFAULTZONE: http://eureka-server:8761/eureka
      STRIPE_RETURN_URL: ${STRIPE_RETURN_URL:-http://localhost:3000}
      STRIPE_KEY_PUBLIC: ${STRIPE_PUBLIC_KEY}
      STRIPE_SECRET_KEY: ${STRIPE_SECRET_KEY}
    ports:
      - "9991:9991"
    networks:
      - postfolio-network
    depends_on:
      eureka-server:
        condition: service_started
    healthcheck:
      test: [ "CMD", "curl", "-f", "http://localhost:9991/actuator/health" ]
      interval: 30s
      timeout: 10s
      retries: 5
      start_period: 40s

networks:
  postfolio-network:
    driver: bridge

volumes:
  postgres_data:
    driver: local
  redis_data:
    driver: local
  rabbitmq_data:
    driver: local
  interview_audio:
    driver: local
