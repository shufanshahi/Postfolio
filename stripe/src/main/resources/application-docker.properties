spring.application.name=stripe
server.port=9991
debug=false

# Stripe Configuration - will be overridden by environment variables
stripe.return.url=http://localhost:3000
stripe.key.public=
stripe.secret.key=

# Disable DataSource auto-configuration
spring.autoconfigure.exclude=org.springframework.boot.autoconfigure.jdbc.DataSourceAutoConfiguration

# Eureka Client Configuration for Docker
eureka.client.service-url.defaultZone=http://eureka-server:8761/eureka
eureka.instance.prefer-ip-address=true
eureka.instance.lease-renewal-interval-in-seconds=10
eureka.instance.hostname=stripe

# Actuator endpoints
management.endpoints.web.exposure.include=health,info
management.endpoint.health.show-details=always